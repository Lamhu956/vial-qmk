name: Compile Vial-QMK Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential gcc-avr binutils-avr avr-libc
        pip install qmk

    - name: Compile firmware
      run: |
        qmk compile -kb lamhu -km vial --output ./firmware_output

    - name: Upload firmware
      uses: actions/upload-artifact@v2
      with:
        name: firmware
        path: ./firmware_output/*.hex  # 指定输出目录
